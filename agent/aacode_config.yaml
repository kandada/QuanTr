agent:
  enable_auto_planning: true
  enable_todo_tracking: true
  max_react_iterations: 300
  max_sub_agent_concurrency: 3
  max_sub_agent_depth: 2
  max_sub_agent_iterations: 100
  subagent_input_token_budget: 400000
  subagent_model: ''
  subagent_output_token_budget: 60000
  subagent_timeout_seconds: 600
context:
  compact_keep_messages: 50
  compact_keep_rounds: 10
  compact_protect_first_rounds: 3
  compact_protect_user_rounds: 2
  compact_summary_steps: 10
  compact_threshold: 32000
  compact_trigger_tokens: 256000
  headroom_tokens: 65536
  history_compression: true
  inline_head_chars: 8000
  inline_tail_chars: 4000
  inline_tool_tokens: 6000
  max_context_length: 1000000
  overflow_retries: 1
  prune_enabled: true
  prune_head_chars: 4096
  prune_min_rounds: 4
  prune_tail_chars: 1024
  prune_threshold_chars: 8192
  read_cache_enabled: true
  repeat_tool_enabled: true
  repeat_tool_thresholds:
  - 3
  - 5
  - 8
  retain_ratio: 0.16
  retrieval_keep_min_rounds: 4
  retrieval_keep_recent_user_messages: 2
  retrieval_keep_tokens: 0
  retrieval_trigger_tokens: 0
  strategy: file_based
  summary_max_tokens: 2000
  summary_min_shadow_tokens: 30000
  summary_mode: adaptive
  summary_model: ''
  summary_provider: ''
  task_input_token_budget: 0
  task_output_token_budget: 0
  use_vector_store: false
  window_ratio: 0.8
language: en
# 隐式 diff 钩子：run_shell 执行后自动检测文件变更并回传 diff，
# 便于模型在迭代开发 programs/ 下量化程序时及时看到改动效果。
diff_hook:
  enabled: true
  small_change_threshold: 10
  max_tracked_files: 50
  max_diff_lines: 60
  max_total_changes_lines: 200
limits:
  max_auto_read_lines: 200
  max_context_files: 50
  max_file_list_results: 100
  max_retries: 1
  max_search_results: 10
  prioritize_file_types: true
  shell_output_preview: 200
  structure_preview_lines: 50
mcp:
  auto_connect: true
  connection_timeout: 30
  enabled: true
  max_retries: 1
  sse_servers:
  - enabled: false
    name: filesystem
    retry_count: 3
    timeout: 30
    url: http://localhost:3001
  - enabled: false
    name: database
    retry_count: 3
    timeout: 30
    url: http://localhost:3002
  - enabled: false
    name: web_search
    retry_count: 3
    timeout: 30
    url: http://localhost:3003
  std_servers:
  - args:
    - -c
    - print('MCP server placeholder')
    command: python3
    enabled: false
    name: local_tools
    retry_count: 3
    timeout: 30
model:
  default_model: deepseek
  max_tokens: 96000
  models:
    deepseek:
      api_key: ''
      base_url: https://api.deepseek.com/v1
      context_window: 1000000
      gateway: openai
      max_output_tokens: 64000
      name: deepseek-v4-flash
      # 可选：按百万 token 计价，用于 usage 成本估算（示例值，可按实际调整）
      pricing:
        input: 2.0
        cache_read: 0.2
        output: 8.0
    minimax_m2.5:
      api_key: ''
      base_url: https://api.minimax.chat/anthropic
      context_window: 200000
      gateway: anthropic
      max_output_tokens: 32000
      name: MiniMax-M2.5
    moonshot_kimi_k2.5:
      api_key: ''
      base_url: https://api.moonshot.cn/v1
      context_window: 256000
      gateway: openai
      max_output_tokens: 32000
      name: kimi-k2.5
  temperature: 0.7
multimodal:
  default_model: moonshot_kimi_k2.5
  enabled: true
  models:
    minimax_m2.5:
      api_key: ''
      base_url: https://api.minimax.chat/v1
      gateway: anthropic
      max_image_size: 10485760
      max_video_size: 104857600
      name: MiniMax-M2.5
      provider: minimax
      supported_formats:
        images:
        - .jpg
        - .jpeg
        - .png
        - .gif
        - .webp
        - .bmp
        videos:
        - .mp4
        - .avi
        - .mov
        - .mkv
        - .webm
      video: true
      vision: true
    moonshot_kimi_k2.5:
      api_key: ''
      base_url: https://api.moonshot.cn/v1
      gateway: openai
      max_image_size: 10485760
      max_video_size: 104857600
      name: kimi-k2.5
      provider: moonshot
      supported_formats:
        images:
        - .jpg
        - .jpeg
        - .png
        - .gif
        - .webp
        - .bmp
        videos:
        - .mp4
        - .avi
        - .mov
        - .mkv
        - .webm
      video: true
      vision: true
output:
  budget_ratio: 0.6
  display_preview_chars: 3000
  max_preview_tokens: 2000
safety:
  allow_network: true
  dangerous_command_action: reject
  enable_safety_guard: true
  max_file_size: 52428800
  # 量化需要读取外部数据缓存（如 akshare 家目录缓存），故不强制限制在项目内
  restrict_to_project: false
  unknown_command_action: allow
skills:
  auto_discover: true
  enabled: true
  skills_dir: skills
timeouts:
  tool_default: 300
  code_execution: 60
  file_search: 20
  model_summary: 60
  sandbox_command: 120
  # 量化任务常有数据抓取/回测等长命令：前台等待放宽，超时后自动转后台
  shell_command: 120
  shell_foreground_max: 600
  shell_idle: 180
  shell_background: 3600
  web_request: 60
tools:
  enable_code_execution: true
  enable_fallback_scrape: true
  enable_sandbox: true
  enable_search: true
  enable_shell: true
  enable_testing: true
  enable_web_search: true
  max_execution_time: 60
  sandbox_type: docker
  search_api_key: ''
  search_api_url: http://192.168.0.106:8081
  search_engine: searxng
  # 工具 schema 分组：auto / core / web / full
  tool_profile: auto
  enable_media_tools: true
  enable_mcp_tools: true
  # 浏览器工具（fastbrowser）：留空自动探测 Chromium
  chrome_path: ''
  cdp_url: ''
  browser_headless: true
  browser_viewport_width: 1280
  browser_viewport_height: 800
